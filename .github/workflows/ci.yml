name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_password
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          weather_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: weather_user
                password: weather_password
                dbname: weather_db
                schema: public
                threads: 1
          EOF

      - name: Create test source data
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              host="localhost",
              port=5432,
              dbname="weather_db",
              user="weather_user",
              password="weather_password"
          )

          with connection.cursor() as cursor:
              cursor.execute("""
                  CREATE TABLE weather_raw (
                      id SERIAL PRIMARY KEY,
                      city VARCHAR(100) NOT NULL,
                      measured_at TIMESTAMP NOT NULL,
                      temperature DECIMAL(5,2),
                      windspeed DECIMAL(5,2),
                      is_day SMALLINT,
                      UNIQUE (city, measured_at)
                  );
              """)

              cursor.execute("""
                  INSERT INTO weather_raw
                      (city, measured_at, temperature, windspeed, is_day)
                  VALUES
                      ('Ostrava', '2026-08-30 10:00:00', 25.1, 12.2, 1),
                      ('Ostrava', '2026-08-30 11:00:00', 26.1, 14.3, 1),
                      ('Ostrava', '2026-08-31 10:00:00', 20.5, 8.1, 1);
              """)

          connection.commit()
          connection.close()
          PY

      - name: Check dbt connection
        working-directory: weather_dbt
        run: dbt debug

      - name: Build dbt project
        working-directory: weather_dbt
        run: dbt build